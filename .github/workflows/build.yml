name: Build Raspberry Pi aarch64

on:
  push:

env:
  ProjectName: Chataigne

jobs:
  raspberrypi:
    name: Raspberry Pi aarch64
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            cpu: cortex-a53
            base_image: raspios_lite_arm64:2022-04-04
            buildFolder: Raspberry64
            buildConfig: Release

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v2
        with:
          repository: benkuper/JUCE
          ref: develop-local
          path: JUCE

      - name: Set Suffix
        id: set_variables
        uses: ./.github/actions/set-suffix
        with:
          os: ${{ matrix.arch }}

      - name: Download and prepare AppImage
        run: |
          wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod a+x appimagetool-x86_64.AppImage
          mkdir -p ./Builds/${{ matrix.buildFolder }}/${{ env.ProjectName }}.AppDir/usr/bin/
        working-directory: ${{ github.workspace }}

      - name: Install dependencies and build
        id: build
        uses: pguyot/arm-runner-action@v2
        with:
          image_additional_mb: 2048
          base_image: ${{ matrix.base_image }}
          cpu: ${{ matrix.cpu }}
          copy_artifact_path: Builds/${{ matrix.buildFolder }}/build/${{ env.ProjectName }}
          copy_artifact_dest: Builds/${{ matrix.buildFolder }}/${{ env.ProjectName }}.AppDir/usr/bin/
          commands: |
            apt-get update
            apt-get install -qyf \
              libcurl3-gnutls \
              libfreetype6-dev \
              libx11-dev \
              libxinerama-dev \
              libxrandr-dev \
              libxcursor-dev \
              libxcomposite-dev \
              mesa-common-dev \
              libasound2-dev \
              freeglut3-dev \
              libcurl4-gnutls-dev \
              libjack-dev \
              libbluetooth-dev \
              libgtk-3-dev \
              libwebkit2gtk-4.0-dev \
              libsdl2-dev \
              libusb-1.0-0-dev \
              libhidapi-dev \
              ladspa-sdk \
              libssl-dev \
              curl

            cd Builds/${{ matrix.buildFolder }}
            make -j2 CONFIG=${{ matrix.buildConfig }}

      - name: Create AppImage
        id: create_package
        run: |
          PKGNAME=${{ env.ProjectName }}-linux-${{ steps.set_variables.outputs.suffix }}.AppImage
          echo "pkg-name=$PKGNAME" >> $GITHUB_OUTPUT
          ARCH=${{ matrix.arch }} \
          ${{ github.workspace }}/appimagetool-x86_64.AppImage \
          --appimage-extract-and-run \
          ${{ env.ProjectName }}.AppDir \
          $PKGNAME
        working-directory: ./Builds/${{ matrix.buildFolder }}

      - name: Upload AppImage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_package.outputs.pkg-name }}
          path: ./Builds/${{ matrix.buildFolder }}/${{ steps.create_package.outputs.pkg-name }}
